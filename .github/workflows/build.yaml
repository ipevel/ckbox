name: build

# ckbox CI：Android + Windows + Linux + macOS 四端构建与发布
# 签名链路：构建未签名产物 → 本地证书签名 → 打包安装器

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  IS_PRERELEASE: ${{ contains(github.ref_name, 'pre') }}
  SHOULD_RELEASE: ${{ !contains(github.ref, '-') || contains(github.ref_name, 'pre') }}
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  # 自签代码签名证书密码（PFX 本体在运行时解码，不落仓库）
  WIN_SIGN_PFX_PASSWORD: ${{ secrets.CKBOX_WIN_SIGN_PFX_PASSWORD }}
  IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ckbox 四端：Android 4 ABI + Windows amd64/arm64(+compatible) + Linux + macOS
          - platform: android
            os: ubuntu-24.04
            arch: arm64
          - platform: android
            os: ubuntu-24.04
            arch: amd64
          - platform: android
            os: ubuntu-24.04
            arch: arm
          - platform: android
            os: ubuntu-24.04
            arch: universal
          - platform: windows
            os: windows-2022
            arch: amd64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: windows
            os: windows-2022
            arch: amd64
            compatible: true
          - platform: macos
            os: macos-26
            arch: arm64
          - platform: macos
            os: macos-26
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
            compatible: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      # --- Rust 工具链（按平台） ---
      - name: Setup Rust (Windows)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: Setup Rust (Android)
        if: matrix.platform == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Rust (Linux)
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust (macOS)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'amd64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Enable Git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      # --- Android 签名：keystore 从 secrets 注入 ---
      - name: Setup Keystore (Android)
        if: matrix.platform == 'android'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          [target.i686-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang"
          EOF

      - name: Install Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::ForceIPv4=true
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::ForceIPv4=true --fix-missing libcurl4-openssl-dev ninja-build libgtk-3-dev rpm

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.compatible == true && '1.24.x' || '1.26.x' }}
          cache-dependency-path: core/go.sum

      - name: Select Xcode (macOS)
        if: matrix.platform == 'macos'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ contains(matrix.os, 'arm') && 'master' || 'stable' }}
          cache: true
          cache-key: flutter-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}
          flutter-version: ${{ contains(matrix.os, 'arm') && '' || '3.47.7' }}

      - name: Clear Pub Cache Credentials
        shell: bash
        run: rm -f ~/.pub-cache/credentials.json 2>/dev/null || true

      - name: Clean Gradle (Android)
        if: matrix.platform == 'android'
        run: |
          cd android
          flutter clean

      - name: Disable Swift Package Manager (macOS)
        if: matrix.platform == 'macos'
        run: flutter config --no-enable-swift-package-manager

      # --- 构建步骤 ---
      - name: Patch for Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cd core
          SING_TUN_VERSION=$(grep -E 'github\.com/metacubex/sing-tun\s+v[^[:space:]]+' go.mod | awk '{print $2}')
          echo "Detected sing-tun version: ${SING_TUN_VERSION}"
          go mod download github.com/metacubex/sing-tun@${SING_TUN_VERSION}
          MOD_CACHE=$(go env GOMODCACHE | tr '\\' '/')
          FILE="${MOD_CACHE}/github.com/metacubex/sing-tun@${SING_TUN_VERSION}/tun_windows.go"
          echo "Patching ${FILE}"
          chmod +w "${FILE}"

      - name: Build Ckbox (Non-Windows)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Prepare Windows Signing Certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CKBOX_WIN_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) {
            throw 'CKBOX_WIN_SIGN_PFX_BASE64 未配置，无法签名 Windows 产物。'
          }
          $path = Join-Path $env:RUNNER_TEMP 'ckbox-sign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "WIN_SIGN_PFX_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "签名证书已就绪：$path"

      - name: Build Core (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart windows --arch ${{ matrix.arch }} --out core-only ${{ matrix.compatible == true && '--compatible' || '' }}

      # 必须先签 core：helper 内嵌的是签名后 core 的 SHA256
      - name: Sign Core (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/sign-windows.ps1 libclash/windows/CkboxCore.exe

      - name: Build HelperService (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/CkboxCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256 (TOKEN for Helper): $coreHash"
          dart setup.dart windows --arch ${{ matrix.arch }} --out helper --core-hash $coreHash ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Sign Helper (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/sign-windows.ps1 libclash/windows/CkboxHelperService.exe

      - name: Build Ckbox (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          $coreHash = (Get-FileHash libclash/windows/CkboxCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256: $coreHash"
          $desc = if ('${{ matrix.compatible }}' -eq 'true') { "${{ matrix.arch }}-compatible" } else { "${{ matrix.arch }}" }
          $appEnv = if ('${{ env.IS_STABLE }}' -eq 'true') { "stable" } else { "pre" }
          $flutterArgs = @(
            "build", "windows", "--release", "--verbose",
            "--dart-define=CORE_SHA256=$coreHash",
            "--dart-define=APP_ENV=$appEnv",
            "--dart-define=APP_ASSET_SUFFIX=windows-$desc-setup.exe"
          )
          if ($env:SENTRY_DSN) {
            $flutterArgs += "--dart-define=SENTRY_DSN=$env:SENTRY_DSN"
          }
          if ($env:IPINFO_TOKEN) {
            $flutterArgs += "--dart-define=IPINFO_TOKEN=$env:IPINFO_TOKEN"
          }
          flutter @flutterArgs

      - name: Sign App Binaries (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dir = if ('${{ matrix.arch }}' -eq 'arm64') { 'build/windows/arm64/runner/Release' } else { 'build/windows/x64/runner/Release' }
          pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/sign-windows.ps1 "$dir/Ckbox.exe" "$dir/WindowsLoopbackManager.exe"

      - name: Package Windows Application
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          dart windows/packaging/exe/package_windows.dart --arch ${{ matrix.arch }} ${{ matrix.compatible == true && '--compatible' || '' }} --env ${{ env.IS_STABLE == 'true' && 'stable' || 'pre' }}

      - name: Sign Installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/sign-windows.ps1 dist

      # --- 上传产物（默认 zip；upload job 下载后解压得到真实文件名） ---
      - name: Upload Artifacts (Android, macOS, Linux)
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@v5
        with:
          name: Ckbox-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}
          path: ./dist/*
          overwrite: true
          if-no-files-found: warn

      - name: Upload Windows Installer Artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v5
        with:
          name: Ckbox-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}-installer
          path: ./dist/*.exe
          overwrite: true
          if-no-files-found: warn

      - name: Upload Windows Portable Artifact
        if: matrix.platform == 'windows' && matrix.compatible == true && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v5
        with:
          name: Ckbox-${{ matrix.platform }}-${{ matrix.arch }}-compatible-portable
          path: ./dist/*.zip
          overwrite: true
          if-no-files-found: warn


  upload:
    if: github.event_name == 'push'
    permissions: write-all
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: Ckbox-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          base_version=$(echo "$version" | sed 's/-pre[0-9]*//')
          if [ "${{ env.IS_PRERELEASE }}" == "true" ]; then
            template=./.github/release_template_pre.md
          else
            template=./.github/release_template.md
          fi
          sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" "$template" > release.md

      - name: Release
        if: ${{ env.SHOULD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
